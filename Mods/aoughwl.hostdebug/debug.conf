# The debug screen, as data.
#
# This file is what `aoughwl.hostdebug` contributes to the debug screen.
# It is a separate mod from the one that DRAWS the screen, and that is not
# tidiness: a mod may not call its own service (`ModSdk/services.nim` - "a mod
# cannot call its own service; call the proc"), so a renderer that also
# published lines would have had to reach its own values by a path no other
# mod could use. Splitting them means the screen has NO lines of its own and
# every line on it, without exception, arrives the way a stranger's does.
#
# Every row is one line, published into `aoughwl.debug.lines` at start-up.
#
# A row is:
#
#     <id>  section=<left|right>  order=<n>  key=<translation key>
#           service=<name>  arg=<what to ask>  every=<frames>  on=<1|0>
#
# and any field may be left out. A value with spaces in it is quoted. A field
# this version has never heard of is IGNORED rather than refused, so a row
# written for a newer build still lands.
#
#   id        namespaced by whoever publishes it, so two mods with something to
#             say about chunks do not collide.
#   key       a translation key looked up in the PLAYER'S OWN language file. A
#             key with nothing behind it draws as the key, which is what
#             Minecraft does and is how you can see that a language file is
#             missing rather than seeing invented English instead. Write
#             `label="whatever you like"` instead if you would rather say it
#             yourself; `key` wins when a row has both.
#   service   who to ask for the value, mod to mod, text in and text out. A row
#             with no service is a line NOBODY can source - see `needs`.
#   every     frames between refreshes. 1 is every frame and is the default.
#             This is the only cost lever on the screen, and it is here rather
#             than in anybody's source because a modpack knows better than we
#             do which of these it cares about being live.
#   needs     for a line that is declared and cannot be sourced: the host call
#             it wants. The line is still drawn, in its place, saying it has no
#             value. A screen with a named gap in it is honest. A screen with
#             the gap quietly closed up is not, and a screen with a plausible
#             number in the gap is the worst thing on this list.
#
# THE ORDER NUMBERS ARE MINECRAFT'S ORDER, in tens, so that anything can be put
# between two of them without renumbering either.
#
# LINES YOU DO NOT SEE HERE come from the mods that know them.
# `aoughwl.voxel` publishes Block, Chunk, Facing and the targeted block,
# because it is the mod that has a world. `aoughwl.hud` publishes what it
# keeps. Neither of them is named anywhere in this mod.

# --- what the host tells anybody -------------------------------------------

mcdebug.version   section=left  order=10   key=debug.version   service=hostdebug.lines  arg=host   every=60
mcdebug.sdk       section=left  order=20   key=debug.sdk       service=hostdebug.lines  arg=sdk    every=60
mcdebug.fps       section=left  order=30   key=debug.fps       service=hostdebug.lines  arg=fps    every=10

# Minecraft's `E: 12/143` and `P: 143`. There is no host call that counts what
# is in the scene or how many particles are alive, and there is no reflective
# way round it either - every door to one is a Unity static and the reflection
# hatch reaches instance members only. So they are declared and empty.
mcdebug.entities  section=left  order=40   key=debug.entities  needs=jester_scene_count
mcdebug.particles section=left  order=50   key=debug.particles needs=jester_particle_count

# Minecraft's blank line between the frame stats and the coordinates. A row
# with nothing to say at all is a gap that still takes a slot, which is exactly
# what the game's own loop does with an empty string.
mcdebug.gap.world section=left  order=90

mcdebug.xyz       section=left  order=100  key=debug.xyz       service=hostdebug.lines  arg=xyz
mcdebug.eyeblock  section=left  order=105  key=debug.eye_block service=hostdebug.lines  arg=eyeblock
mcdebug.axis      section=left  order=135  key=debug.axis      service=hostdebug.lines  arg=axis   every=2

# Minecraft's Biome line. Nothing in this modpack generates biomes yet, so
# there is nothing to ask. Left here, in its place, saying so: when a mod that
# has biomes turns up, it publishes `<its id>.biome` and this row is what tells
# you the space was always there.
mcdebug.biome     section=left  order=160  key=debug.biome     needs=a-mod-that-generates-biomes

# --- the right column: the machine -----------------------------------------

mcdebug.display   section=right order=10   key=debug.display   service=hostdebug.lines  arg=display every=20

# Minecraft's `Mem: 45% 900/2048MB`, `Allocated:`, `CPU:` and the two GPU
# lines. None of these has a host call, and none of them can be reached the
# long way round: `GC.GetTotalMemory`, `Profiler.GetTotalAllocatedMemory` and
# every field of `SystemInfo` are STATICS, and the reflection escape hatch in
# this surface invokes public INSTANCE members only. There is no mod-side
# answer to any of them. They are declared, in the game's own order, with the
# call each one wants written next to it.
mcdebug.gap.mem   section=right order=20
mcdebug.memory    section=right order=30   key=debug.memory    needs=jester_system_memory
mcdebug.allocated section=right order=40   key=debug.allocated needs=jester_system_memory
mcdebug.cpu       section=right order=50   key=debug.cpu       needs=jester_system_cpu
mcdebug.gap.gpu   section=right order=60
mcdebug.gpu       section=right order=70   key=debug.gpu       needs=jester_system_gpu
mcdebug.driver    section=right order=80   key=debug.driver    needs=jester_system_gpu
