# The shape of the debug screen, as opposed to the lines on it.
#
# The lines come from whichever mods have something to say - see
# `aoughwl.hostdebug/debug.conf` for the ones the host can answer. This
# file is the screen itself, and it is the file a modpack replaces to reshape
# one. Its rows go into `aoughwl.debug.layout`, which is the override
# layer: `screen` for the whole screen, `*` for every line at once, and any
# line's own id for just that line.

# --- the screen itself -----------------------------------------------------

# missing   the translation key shown where a line has no value.
# font      `host` or `pack`.
#
#           `pack` sets every line in the player's own bitmap font, which is
#           what Minecraft's screen looks like. It costs ONE HOST CROSSING PER
#           GLYPH - about 4.9 microseconds each - so a thirty-line screen of
#           thirty characters is nine hundred crossings and four and a half
#           milliseconds a frame. That is a quarter of a 60Hz frame spent
#           drawing the screen that tells you where your frame went.
#
#           `host` is one crossing a line: about a fifth of a millisecond for
#           the same screen, twenty times cheaper, and it is legible to
#           anything that reads the screen rather than looking at it. It is the
#           default for both reasons. Change it if you would rather have the
#           picture; nothing else changes.
# on        whether the screen starts up shown. F3 toggles it either way, and
#           whichever way you left it is remembered.
screen  missing=debug.unavailable  font=host  on=0


# Two rows a modpack might add here, left as comments because they are examples
# and not settings:
#
#     *                every=4     turn the WHOLE screen down to fifteen
#                                  refreshes a second, in one row
#     mcdebug.axis     on=0        drop one line
#     mcdebug.xyz      order=5     move one to the top
